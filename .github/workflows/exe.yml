name: Windows exe

on:
  workflow_dispatch:
  push:
    branches: [claude/low-ram-browser-5417a0, main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --windowed --name Tarayici tarayici.py
      - run: Compress-Archive -Path dist/Tarayici -DestinationPath Tarayici-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tarayici-Windows
          path: Tarayici-Windows.zip
